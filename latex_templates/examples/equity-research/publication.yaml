# Configuration for the equity-research example. report.tex remains the
# direct-TeX compatibility witness; manuscript/order.txt plus fragments/ are
# the corresponding `reportkit build` authoring path. The two paths share the
# same registry-selected theme/publication identity, while the Markdown path
# intentionally uses the pipeline's generic paged entrypoint.
publication:
  title: Nexa Cloud Solutions (NXCL) -- Update
  subtitle: AI infrastructure demand holds up; services mix provides an offset
  author: ReportKit Research
  version: v1.0
document:
  main: report.tex
  class: reportkit
  engine: lualatex
  theme: institutional-research
  publication_type: equity-research
  paper: letter
theme:
  font_family: Google Sans
  font_policy: fallback

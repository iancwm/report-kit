name: Data Engineering Guide

on:
  pull_request:
    paths:
      - "data_engineering_guide/**"
      - "latex_templates/**"
      - ".github/workflows/data-engineering-guide.yml"
  push:
    branches: [main]
    paths:
      - "data_engineering_guide/**"
      - "latex_templates/**"
      - ".github/workflows/data-engineering-guide.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    # Historic TeX Live keeps the TeX package set stable while Python, Pandoc,
    # and PyMuPDF are pinned below. The image is intentionally TeX-capable.
    container:
      image: texlive/texlive:TL2025-historic
    env:
      PANDOC_VERSION: 3.1.3
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 python3-venv
          curl --fail --location --show-error --silent --output /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          dpkg -i /tmp/pandoc.deb
      - name: Install guide renderer
        run: python3 -m venv data_engineering_guide/build/.venv && data_engineering_guide/build/.venv/bin/python -m pip install --requirement data_engineering_guide/requirements.txt
      - name: Validate sources
        run: python3 data_engineering_guide/scripts/validate-guide.py
      - name: Run guide unit tests
        run: data_engineering_guide/build/.venv/bin/python -m unittest discover -s data_engineering_guide/tests -v
      - name: Build combined guide
        run: bash data_engineering_guide/scripts/combine.sh
      - name: Upload guide artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-engineering-guide-build
          path: data_engineering_guide/build/combined/

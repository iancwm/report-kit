name: ReportKit contract and renderer gates

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".dockerignore"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "pyproject.toml"
      - "LICENSE"
      - "latex_templates/**"
      - "publication_pipeline/**"
      - "python_scripts/**"
      - "reportkit"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "toolchain/**"
      - "SKILL.md"
      - "references/**"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - ".dockerignore"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "pyproject.toml"
      - "LICENSE"
      - "latex_templates/**"
      - "publication_pipeline/**"
      - "python_scripts/**"
      - "reportkit"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "toolchain/**"
      - "SKILL.md"
      - "references/**"

jobs:
  pinned-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable ReportKit toolchain
        run: docker build --file toolchain/Dockerfile --tag reportkit-ci .
      - name: Verify contract, schemas, diagnostics, and renderers
        run: >-
          docker run --rm --entrypoint /bin/bash reportkit-ci -lc
          'export PATH="/opt/reportkit/.venv/bin:$PATH" &&
          ./reportkit doctor --require pinned-toolchain --json &&
          ./reportkit docs --check --json &&
          python -m pytest tests publication_pipeline/tests -q &&
          python -m pip install --disable-pip-version-check --no-cache-dir ruff &&
          ruff check python_scripts publication_pipeline scripts tests adapters toolchain &&
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit &&
          (pip-audit -r toolchain/requirements.lock || true) &&
          bash scripts/acceptance_check.sh --require-tex &&
          python scripts/contract_acceptance.py --json &&
          PYTHONPATH=python_scripts python latex_templates/examples/equity-research/figures.py &&
          python scripts/visual_qa_equity_research.py --json'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Container workflow gate (Linux / ext4, uid 10001, no network)
        env:
          REPORTKIT_CONTAINER_TEST_IMAGE: reportkit-ci
          REPORTKIT_REQUIRE_DOCKER: "1"
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest --noconftest -q tests/test_container_integration.py

  container-launcher-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4   # Windows runner checks out with core.autocrlf=true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Launcher, staging, results and gate unit tests (stdlib only)
        run: >-
          python -m pytest --noconftest -q
          tests/test_container_staging.py tests/test_container_docker.py
          tests/test_container_results.py tests/test_container_launcher.py
          tests/test_cross_host_gate.py tests/test_repository_hygiene.py
